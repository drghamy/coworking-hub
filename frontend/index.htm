<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CoWork Hub | Sign In</title>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-intro">
            <p class="eyebrow">CoWork Hub</p>
            <h1>Manage and book coworking spaces</h1>
            <p>Sign in to search spaces, create bookings, submit reviews, and access management dashboards based on your role.</p>
        </section>

        <section class="panel auth-panel" id="loginForm">
            <h2>Sign In</h2>
            <label for="loginUser">Username</label>
            <input type="text" id="loginUser" autocomplete="username">
            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" autocomplete="current-password">
            <button onclick="login()">Sign In</button>
            <button class="secondary" onclick="toggleForm()">Create Account</button>
            <p class="message" id="loginMessage"></p>
        </section>

        <section class="panel auth-panel hidden" id="registerForm">
            <h2>Create Account</h2>
            <label for="regUser">Username</label>
            <input type="text" id="regUser" autocomplete="username">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" autocomplete="email">
            <label for="regPass">Password</label>
            <input type="password" id="regPass" autocomplete="new-password">
            <button onclick="register()">Register</button>
            <button class="secondary" onclick="toggleForm()">I Already Have an Account</button>
            <p class="message" id="registerMessage"></p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
